<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 — Nobi</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #050505;
        color: #f2f0eb;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        background-image: radial-gradient(600px circle at 50% 30%, rgba(127, 176, 143, 0.12), transparent 60%);
      }
      .code {
        font-size: clamp(96px, 28vw, 220px);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #f2f0eb 25%, #7fb08f 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 18px 0 30px; color: #a6a6a6; font-size: 18px; }
      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #7fb08f;
        color: #050505;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <p>This page doesn't exist.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
